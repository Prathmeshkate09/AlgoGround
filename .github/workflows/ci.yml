name: AlgoGround CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend PyTest & Health Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Test Suite
        run: |
          pytest tests/test_api.py -v

  test-frontend:
    name: Frontend Syntax & Web Fundamentals Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML & JavaScript Integrity
        run: |
          node -c frontend/js/worker.js
          node -c frontend/js/questions.js
          echo "Frontend syntax check passed cleanly."
